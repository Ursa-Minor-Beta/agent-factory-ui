schemaVersion: 1.0

# Client stack of the Ursa parent (Ursa-Minor-Beta/infra, stack ursa/ursa).
# Static SPA behind nginx. No app secrets; the API URL is a build arg in
# docker-compose.sc.yaml, not runtime env.

stacks:
  test:
    type: cloud-compose
    parent: ursa/ursa
    parentEnv: test
    config:
      dockerComposeFile: ${git:root}/docker-compose.sc.yaml
      domain: test-agent-factory-ui.everworker.ai
      baseDnsZone: everworker.ai
      domainProxied: true
      lbConfig:
        https: false
      staticEgressIP: false
      runs:
        - agent-factory-ui
      size:
        cpu: 256
        memory: 512
      scale:
        min: 1
        max: 1
      cloudExtras:
        securityGroup:
          ingress:
            allowOnlyCloudflare: true

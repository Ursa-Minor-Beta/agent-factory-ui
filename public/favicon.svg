<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="grad" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="#0f172a"/>

  <!-- Particles at top -->
  <g filter="url(#softGlow)" opacity="0.7">
    <circle cx="23" cy="10" r="1.2" fill="#67e8f9"/>
    <circle cx="28" cy="9" r="1" fill="#67e8f9"/>
    <circle cx="33" cy="10" r="1.2" fill="#67e8f9"/>
    <circle cx="38" cy="9" r="1" fill="#67e8f9"/>
  </g>

  <!-- Main A shape - shorter height -->
  <g filter="url(#glow)">
    <!-- Peak -->
    <rect x="21" y="14" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="25.5" y="14" width="4" height="4" rx="0.75" fill="url(#grad)"/>

    <!-- Row 2 -->
    <rect x="19" y="19" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="27.5" y="19" width="4" height="4" rx="0.75" fill="url(#grad)"/>

    <!-- Middle crossbar -->
    <rect x="17" y="24" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="21.5" y="24" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="26" y="24" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="30.5" y="24" width="4" height="4" rx="0.75" fill="url(#grad)"/>

    <!-- Row 4 -->
    <rect x="15" y="29" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="32.5" y="29" width="4" height="4" rx="0.75" fill="url(#grad)"/>

    <!-- Bottom -->
    <rect x="13" y="34" width="4" height="4" rx="0.75" fill="url(#grad)"/>
    <rect x="34.5" y="34" width="4" height="4" rx="0.75" fill="url(#grad)"/>
  </g>
</svg>

name: Deploy agent-factory-ui to test

# Deploys the `agent-factory-ui` Simple Container client stack into the
# Ursa `test` environment (parent ursa/ursa in Ursa-Minor-Beta/infra).
# Deploy the API (Ursa-Minor-Beta/agent-factory) first: this bundle is built
# against its live URL.
# Deliberately not triggered by pushes to master.
on:
  workflow_dispatch:
  push:
    branches: [sc-deploy-test]

permissions:
  contents: read

concurrency:
  group: sc-deploy-agent-factory-ui-test
  cancel-in-progress: false

env:
  UI_URL: https://test-agent-factory-ui.everworker.ai
  API_HOST: test-agent-factory.everworker.ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: simple-container-com/actions/install-sc@d6d5c88e8609f5f17a8e45580b7331a7c2b95187  # main
        with:
          version: '2026.8.7'  # matches the Integrail fleet default

      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11  # v2.0.0

      # `sc deploy` does not clone the parent (parentRepository in SC_CONFIG is
      # only read by the upstream SC action). Clone Ursa-Minor-Beta/infra with
      # the SC key (a read-only deploy key there), reveal its secrets, and copy
      # its stacks next to ours. The key only ever lives in a 0600 temp file.
      - name: Fetch parent stack
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          chmod 600 "$keyfile"
          printf '%s\n' "$SIMPLE_CONTAINER_CONFIG" | python3 -c 'import sys, yaml; sys.stdout.write(yaml.safe_load(sys.stdin)["privateKey"])' > "$keyfile"
          GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --quiet --depth 1 git@github.com:Ursa-Minor-Beta/infra.git .infra
          (cd .infra && sc secrets reveal --force)
          cp -fR .infra/.sc/stacks/* .sc/stacks/

      # SC_CONFIG is raw YAML (never base64): the CI RSA key + parentRepository.
      - name: sc deploy
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: sc deploy -s agent-factory-ui -e test

      - name: Health gate
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$UI_URL/health" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      # A green deploy can still serve a bundle wired to localhost. Fail unless
      # the served JS carries the real API host. The config lands in a shared
      # chunk whose name drifts, so fetch every chunk the entry references.
      - name: Bundle gate
        run: |
          mkdir -p served && cd served
          curl -fsS "$UI_URL/" -o index.html
          entry=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' index.html | head -1)
          [ -n "$entry" ] || { echo "no index bundle found"; exit 1; }
          curl -fsS "$UI_URL/$entry" -o entry.js
          { grep -oE 'assets/[A-Za-z0-9_.-]+\.js' index.html
            grep -oE '(\./|assets/)[A-Za-z0-9_.-]+\.js' entry.js | sed 's|^\./|assets/|'
          } | sort -u | while read -r f; do curl -fsS "$UI_URL/$f" -o "$(basename "$f")"; done
          if grep -l 'localhost:3000' ./*.js; then echo "bundle points at localhost:3000"; exit 1; fi
          grep -l "$API_HOST" ./*.js || { echo "bundle lacks $API_HOST"; exit 1; }
          echo "bundle wired to $API_HOST"
